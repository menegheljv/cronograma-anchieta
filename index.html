<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex,nofollow">
<title>Cronograma de Outubro 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#faf7f2; --surface:#fff; --surface-2:#f3efe7; --border:#e6ded0;
  --ink:#211f1a; --ink-soft:#645d4e; --ink-faint:#a49c8a; --accent:#c23a6b;
  --joao:#159a56; --renata:#9333ea; --isabela:#ff2d95; --marcos:#1d4ed8;
  --wandinho:#c0392b; --mariana:#e0680f; --definir:#64748b;
  --joao-soft:#dcf5e6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.4}
.wrap{max-width:1120px;margin:0 auto;padding:28px 16px 64px}
h1{font-size:clamp(26px,5vw,36px);margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:0;color:var(--ink-soft);text-wrap:pretty}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 22px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.dow{margin-bottom:6px}
.dow span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);text-align:center}
.cell{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px;min-height:112px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cell.empty{background:transparent;border-color:transparent}
.cell.weekend{background:var(--surface-2)}
.cell.has-joao{background:var(--joao-soft);border-color:var(--joao)}
.cell.today{outline:2px solid var(--accent);outline-offset:1px}
.num{font-weight:700;font-size:14px;line-height:1}
.item{font-size:11.5px;line-height:1.3;padding-left:7px;border-left:3px solid var(--c);color:var(--ink);text-wrap:pretty;overflow-wrap:anywhere}
.item b{color:var(--c);font-weight:700}
.item.dim{--c:#9a9a9a;color:#8a8a8a;opacity:.85}
.item.dim b{color:#8a8a8a}
.cell.dim,.day.dim{background:var(--surface-2);border-color:var(--border);color:#8a8a8a}
.cell.dim .num,.day.dim h2{color:#8a8a8a}
.item.past{--c:#9a9a9a;color:#8a8a8a;opacity:.85}
.item.past b{color:#8a8a8a}
.cell.past,.day.past{background:var(--surface-2);border-color:var(--border);color:#8a8a8a}
.cell.past .num,.day.past h2{color:#8a8a8a}
.item.past::before{content:"✓ ";font-weight:700}
.list{display:none}
.day{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.day.weekend{background:var(--surface-2)}
.day.has-joao{background:var(--joao-soft);border-color:var(--joao)}
.day.today{outline:2px solid var(--accent);outline-offset:1px}
.day h2{margin:0 0 8px;font-size:15px}
.day h2 small{font-weight:400;color:var(--ink-soft);margin-left:6px}
.day .item{font-size:14px;margin-top:8px}
.item small{display:block;color:var(--ink-soft);font-size:12.5px}
.foot{margin-top:28px;color:var(--ink-faint);font-size:12.5px}
@media (max-width:860px){
  .dow,.grid{display:none}
  .list{display:block}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Cronograma de Outubro 2026</h1>
  <p class="sub">Prefeitura de Anchieta · pautas de conteúdo das redes sociais</p>
  <div class="filters" id="filters" role="group" aria-label="Filtrar por responsável"></div>
  <div class="dow"><span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span></div>
  <div class="grid" id="grid"></div>
  <div class="list" id="list"></div>
  <p class="foot">Página somente leitura. Alterações são feitas pela coordenação.</p>
</div>
<script>
const OWNERS = {
  "João":"--joao","Renata":"--renata","Isabela":"--isabela","Marcos":"--marcos",
  "Wandinho":"--wandinho","Mariana":"--mariana","A definir":"--definir"
};
// [dia, pauta, responsável, observação]
const ITEMS = [
[1,"Início do Outubro Rosa e Novembro Azul: Câncer de Mama","A definir","Mudar a identidade visual das redes sociais"],
[1,"TBT do mês de setembro","Isabela","Produzir"],
[1,"Dia Internacional das Pessoas Idosas / Dia Nacional do Idoso","A definir","Post carrossel mostrando as atividades oferecidas aos idosos"],
[1,"Dia Internacional do Café","A definir","Meme para feed"],
[2,"Outubro Rosa e Novembro Azul","A definir","Card feed / mudar identidade visual das redes sociais"],
[2,"Dia Mundial do Sorriso","Mariana","Verificar com a Saúde"],
[2,"A Semana em 1 min","João","Produzir vídeo"],
[3,"Dia Mundial do Dentista","Renata","Card stories"],
[4,"Dia dos Animais / Dia do Cachorro","A definir","Postar novamente o carrossel dos animais para adoção"],
[4,"Dia do Agente Comunitário de Saúde","Renata","Card stories"],
[4,"Dia do Médico do Trabalho / Agentes de Combate às Endemias","Renata","Card stories"],
[5,"Dia Nacional da Micro e Pequena Empresa","Renata","Card stories"],
[6,"CRAS x CREAS: qual a diferença?","A definir","Produzir post carrossel"],
[7,"Vídeo Turismo de Iriri","João","Convidando para o festival"],
[8,"Dia Mundial da Visão","Mariana","Verificar com a Saúde"],
[9,"A Semana em 1 min","João","Produzir vídeo"],
[9,"28º Festival Capixaba de Frutos do Mar","A definir","Início do festival"],
[9,"Gabinete em Ação: chamada com depoimentos","A definir","Produzir vídeo"],
[10,"Dia Mundial da Saúde Mental","A definir","Gravar vídeo"],
[10,"Dia Nacional de Luta Contra a Violência à Mulher","A definir","Lei Maria da Penha / Patrulha Maria da Penha de Anchieta"],
[10,"28º Festival Capixaba de Frutos do Mar","A definir",""],
[11,"28º Festival Capixaba de Frutos do Mar","A definir",""],
[11,"Vídeo Turismo: paisagens","João","Produzir"],
[12,"Dia Nacional da Leitura e Dia das Crianças","A definir","Vídeo com imagens de crianças na biblioteca móvel"],
[12,"Dia do Engenheiro Agrônomo","Renata","Card stories"],
[12,"28º Festival Capixaba de Frutos do Mar","A definir",""],
[13,"Dia Nacional do Fisioterapeuta e do Terapeuta Ocupacional","Renata","Card stories"],
[13,"28º Festival Capixaba de Frutos do Mar","A definir",""],
[14,"Gabinete em Ação em Simpatia","A definir","Pauta a confirmar"],
[15,"Dia do Professor","A definir","Gravar vídeo"],
[15,"Dia Internacional da Mulher Rural","Renata","Card stories"],
[15,"28º Festival Capixaba de Frutos do Mar","A definir",""],
[16,"A Semana em 1 min","João","Produzir vídeo"],
[16,"28º Festival Capixaba de Frutos do Mar","João","2º fim de semana do festival"],
[17,"Dia da Agricultura","A definir","Serviços oferecidos aos agricultores de Anchieta"],
[17,"Dia Nacional da Vacinação","Mariana","Verificar com a Saúde"],
[17,"28º Festival Capixaba de Frutos do Mar","João","2º fim de semana do festival"],
[18,"Dia do Médico","Renata","Card stories"],
[18,"28º Festival Capixaba de Frutos do Mar","João","Encerramento"],
[19,"Dia Internacional de Combate ao Câncer de Mama","Mariana","Verificar com a Saúde"],
[20,"Dia Mundial de Combate ao Bullying","A definir","Produzir post carrossel"],
[21,"Dia Nacional da Alimentação na Escola","A definir","Produzir card feed"],
[22,"Aulas de música nas escolas de Anchieta","A definir","Produzir vídeo"],
[23,"A Semana em 1 min","João","Produzir vídeo"],
[24,"Foto/Vídeo Turismo","João",""],
[25,"Dia do Dentista","Renata","Card stories"],
[26,"Dia do Trabalhador da Construção Civil","A definir","Produzir vídeo"],
[27,"Você conhece um local que precisa de um PEV?","A definir","Produzir card feed"],
[28,"Dia do Servidor Público","A definir","Produzir card feed"],
[29,"TBT do mês de outubro","Isabela","Produzir"],
[30,"A Semana em 1 min","João","Produzir vídeo"],
[31,"Foto/Vídeo Turismo","João",""]
];

const FIRST_DOW = 4; // 1/10/2026 é quinta-feira
const DAYS = 31;
const DOW = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const now = new Date();
const TODAY = (now.getFullYear()===2026 && now.getMonth()===9) ? now.getDate() : 0;
const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
const isPast = d => new Date(2026, 9, d) < startOfToday;
let active = null;

function h(tag, cls, text){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function itemEl(it, withNote){
  const past = isPast(it[0]);
  const [, title, owner, note] = it;
  const n = h("div", "item" + (past ? " past" : ""));
  n.style.setProperty("--c", `var(${OWNERS[owner]})`);
  n.dataset.owner = owner;
  const b = h("b", null, owner === "A definir" ? "" : owner + ": ");
  n.appendChild(b);
  n.appendChild(document.createTextNode(title));
  if (withNote && note){ n.appendChild(h("small", null, note)); }
  return n;
}
function render(){
  const grid = document.getElementById("grid");
  const list = document.getElementById("list");
  grid.textContent = ""; list.textContent = "";
  for (let i=0;i<FIRST_DOW;i++) grid.appendChild(h("div","cell empty"));
  for (let d=1; d<=DAYS; d++){
    const dow = (d-1+FIRST_DOW)%7;
    const day = ITEMS.filter(it => it[0]===d);
    const hasJoao = day.some(it => it[2]==="João");
    const weekend = dow===0 || dow===6;
    const flags = (weekend?" weekend":"")+(hasJoao?" has-joao":"")+(d===TODAY?" today":"")+(isPast(d)?" past":"");

    const owners = day.map(it => it[2]).join("|");
    const cell = h("div","cell"+flags);
    cell.dataset.owners = owners;
    cell.appendChild(h("span","num",String(d)));
    day.forEach(it => cell.appendChild(itemEl(it,false)));
    grid.appendChild(cell);

    const card = h("div","day"+flags);
    card.dataset.owners = owners;
    const hd = h("h2",null,String(d));
    hd.appendChild(h("small",null,DOW[dow]));
    card.appendChild(hd);
    day.forEach(it => card.appendChild(itemEl(it,true)));
    list.appendChild(card);
  }
  applyFilter();
}
function applyFilter(){
  document.querySelectorAll(".item").forEach(n => {
    n.classList.toggle("dim", !!active && n.dataset.owner !== active);
  });
  document.querySelectorAll(".cell:not(.empty), .day").forEach(n => {
    const has = (n.dataset.owners || "").split("|").includes(active);
    n.classList.toggle("dim", !!active && !has);
  });
  document.querySelectorAll("#filters .chip").forEach(c => {
    c.setAttribute("aria-pressed", String((c.dataset.owner||null) === active));
  });
}
function buildFilters(){
  const box = document.getElementById("filters");
  const all = h("button","chip","Todos");
  all.type = "button";
  all.addEventListener("click", () => { active = null; applyFilter(); });
  box.appendChild(all);
  const used = [...new Set(ITEMS.map(i => i[2]))];
  Object.keys(OWNERS).filter(o => used.includes(o)).forEach(o => {
    const c = h("button","chip");
    c.type = "button";
    c.dataset.owner = o;
    const dot = h("span","dot");
    dot.style.background = `var(${OWNERS[o]})`;
    c.appendChild(dot);
    c.appendChild(document.createTextNode(o));
    c.addEventListener("click", () => { active = (active===o ? null : o); applyFilter(); });
    box.appendChild(c);
  });
}
buildFilters();
render();
</script>
</body>
</html>
